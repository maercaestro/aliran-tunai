name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ============= TESTING PHASE =============
  test-python:
    name: Test Python Backend
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: testuser
          MONGO_INITDB_ROOT_PASSWORD: testpass
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock pytest-asyncio python-dotenv
        pip install flake8 black isort mypy bandit safety
        
    - name: Create test environment file
      run: |
        cat > .env.test << EOF
        MONGO_URI=mongodb://testuser:testpass@localhost:27017/test_db?authSource=admin
        TELEGRAM_BOT_TOKEN=test_token_for_ci
        OPENAI_API_KEY=test_openai_key
        WHATSAPP_VERIFY_TOKEN=test_verify_token
        WHATSAPP_ACCESS_TOKEN=test_access_token
        WHATSAPP_PHONE_NUMBER_ID=test_phone_id
        JWT_SECRET_KEY=test_jwt_secret_key
        
        # Personal Budget Feature Flags
        ENABLE_PERSONAL_BUDGET=true
        ENABLE_BUSINESS=true
        DEFAULT_MODE=personal
        ALLOW_MODE_SWITCHING=true
        
        FLASK_ENV=testing
        EOF
        
    - name: Run environment validation
      run: |
        echo "Running environment validation..."
        python scripts/validate_environment.py || echo "Environment validation completed with warnings"
        
    - name: Run code quality checks
      run: |
        echo "Running code formatting checks..."
        black --check . || echo "Code formatting issues found - fix with 'black .'"
        echo "Running import sorting checks..."
        isort --check-only . || echo "Import sorting issues found - fix with 'isort .'"
        echo "Running linting..."
        flake8 . --max-line-length=120 --extend-ignore=E203,W503 || echo "Linting issues found"
        
    - name: Run type checking
      run: |
        echo "Running type checking..."
        mypy . --ignore-missing-imports --no-strict-optional || echo "Type checking completed with issues"
        
    - name: Run security checks
      run: |
        echo "Running security analysis..."
        bandit -r . -f json -o bandit-report.json || true
        echo "Checking for vulnerabilities in dependencies..."
        safety check --json --output safety-report.json || true
        
    - name: Run unit tests with coverage
      run: |
        echo "Running unit tests..."
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=html --cov-report=term || echo "Some tests failed"
      env:
        PYTHONPATH: .
        
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: always()
      with:
        file: ./coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false
        
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          htmlcov/
          bandit-report.json
          safety-report.json

  # ============= INTEGRATION TESTING =============
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-python]
    
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: testuser
          MONGO_INITDB_ROOT_PASSWORD: testpass
        ports:
          - 27017:27017
          
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio requests
        
    - name: Create integration test environment
      run: |
        cat > .env.integration << EOF
        MONGO_URI=mongodb://testuser:testpass@localhost:27017/integration_test_db?authSource=admin
        TELEGRAM_BOT_TOKEN=integration_test_token
        OPENAI_API_KEY=integration_test_key
        WHATSAPP_VERIFY_TOKEN=integration_verify_token
        WHATSAPP_ACCESS_TOKEN=integration_access_token
        WHATSAPP_PHONE_NUMBER_ID=integration_phone_id
        JWT_SECRET_KEY=integration_test_jwt_secret
        
        # Personal Budget Feature Flags
        ENABLE_PERSONAL_BUDGET=true
        ENABLE_BUSINESS=true
        DEFAULT_MODE=personal
        ALLOW_MODE_SWITCHING=true
        
        FLASK_ENV=testing
        EOF
        
    - name: Run integration tests
      run: |
        echo "Starting integration tests..."
        python -m pytest integration_tests/ -v || echo "Integration tests completed with some failures"
      env:
        PYTHONPATH: .

  # ============= DEPLOYMENT PHASE =============
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [test-python, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-ec2-prod
      cancel-in-progress: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

    - name: Create deployment package
      run: |
        echo "Creating deployment package..."
        # Write tarball OUTSIDE the source tree so tar doesn't read its own
        # growing output and exit with "file changed as we read it".
        tar -czf /tmp/deployment-package.tar.gz \
          --exclude='./.git' \
          --exclude='./node_modules' \
          --exclude='./__pycache__' \
          --exclude='./.pytest_cache' \
          --exclude='./htmlcov' \
          --exclude='*.log' \
          --exclude='./.env*' \
          --exclude='./venv' \
          --exclude='./aliran' \
          --exclude='*.pyc' \
          --exclude='.DS_Store' \
          --exclude='*.tmp' \
          --exclude='*.temp' \
          --exclude='./frontend/node_modules' \
          --exclude='./frontend/dist' \
          .
        ls -lh /tmp/deployment-package.tar.gz

    - name: Upload package to EC2
      run: |
        scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          /tmp/deployment-package.tar.gz \
          ec2-user@${{ secrets.EC2_HOST }}:/tmp/deployment-package.tar.gz

    - name: Deploy on EC2
      env:
        # Runtime secrets used to seed .env on first deploy
        MONGO_URI: ${{ secrets.MONGO_URI }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
        WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
        WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ secrets.WHATSAPP_BUSINESS_ACCOUNT_ID }}
        WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
        WHATSAPP_API_VERSION: ${{ secrets.WHATSAPP_API_VERSION }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      run: |
        # Pass secrets to remote shell via environment, then execute the
        # deploy script. SendEnv requires the server to AcceptEnv these vars,
        # so instead we write a temp env-file, scp it over, source it, and
        # delete it after writing /opt/aliran-tunai/current/.env.
        cat > /tmp/runtime.env <<RUNENV
        MONGO_URI=${MONGO_URI}
        OPENAI_API_KEY=${OPENAI_API_KEY}
        JWT_SECRET_KEY=${JWT_SECRET_KEY}
        WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
        WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
        WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
        WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
        WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION:-v23.0}
        WHATSAPP_PORT=5002
        TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
        WEBHOOK_URL=${WEBHOOK_URL}
        FLASK_ENV=production
        FLASK_DEBUG=False
        ENABLE_PERSONAL_BUDGET=true
        ENABLE_BUSINESS=true
        DEFAULT_MODE=business
        ALLOW_MODE_SWITCHING=true
        LOG_LEVEL=INFO
        LOG_FILE=/var/log/aliran-tunai/app.log
        RUNENV
        chmod 600 /tmp/runtime.env

        scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          /tmp/runtime.env \
          ec2-user@${{ secrets.EC2_HOST }}:/tmp/runtime.env
        rm -f /tmp/runtime.env

        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          ec2-user@${{ secrets.EC2_HOST }} 'bash -s' <<'REMOTE'
          set -e
          APP_USER=$(whoami)
          echo "Deploying as $APP_USER on $(hostname)"

          # Stop services so files can be swapped safely
          sudo systemctl stop aliran-api-server 2>/dev/null || true
          sudo systemctl stop aliran-whatsapp 2>/dev/null || true

          # App directories
          sudo mkdir -p /opt/aliran-tunai /var/log/aliran-tunai
          sudo chown -R $APP_USER:$APP_USER /opt/aliran-tunai /var/log/aliran-tunai
          cd /opt/aliran-tunai

          # Rotate releases: backup -> previous, current -> backup
          if [ -d backup ]; then sudo rm -rf previous && mv backup previous || true; fi
          if [ -d current ]; then mv current backup; fi

          mkdir current && cd current
          tar -xzf /tmp/deployment-package.tar.gz
          rm -f /tmp/deployment-package.tar.gz

          # System deps. Amazon Linux 2023 uses dnf; AL2 uses yum.
          # Core packages must succeed; tesseract isn't in the default AL2023
          # repo so we try EPEL and fall back to a warning if it can't be
          # installed (OCR is degraded but the rest of the bot still runs).
          if command -v dnf >/dev/null 2>&1; then PKG=dnf; else PKG=yum; fi
          sudo $PKG install -y \
            python3 python3-pip python3-devel \
            gcc make nginx

          if ! command -v tesseract >/dev/null 2>&1; then
            echo "Attempting to install tesseract via EPEL..."
            sudo $PKG install -y \
              https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm \
              || echo "EPEL release package install failed; continuing"
            sudo $PKG install -y tesseract \
              || echo "WARN: tesseract not installed; OCR features disabled"
          fi

          # Python venv
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

          # .env: prefer existing, then backup, finally seed from CI secrets
          if [ -f /opt/aliran-tunai/backup/.env ]; then
            cp /opt/aliran-tunai/backup/.env .env
          fi
          if [ ! -f .env ]; then
            cp /tmp/runtime.env .env
          fi
          chmod 600 .env
          rm -f /tmp/runtime.env

          # systemd units (substitute APP_USER)
          sed "s/abuhuzaifahbidin/$APP_USER/g" deploy/aliran-api-server.service \
            | sudo tee /etc/systemd/system/aliran-api-server.service > /dev/null
          sed "s/abuhuzaifahbidin/$APP_USER/g" deploy/aliran-whatsapp.service \
            | sudo tee /etc/systemd/system/aliran-whatsapp.service > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl enable aliran-api-server aliran-whatsapp
          sudo systemctl restart aliran-api-server
          sudo systemctl restart aliran-whatsapp

          # nginx (first run only). Amazon Linux uses /etc/nginx/conf.d/.
          # Always ensure the directory exists in case the nginx package
          # didn't create it for some reason.
          sudo mkdir -p /etc/nginx/conf.d
          if [ ! -f /etc/nginx/conf.d/aliran-tunai.conf ]; then
            sudo cp deploy/nginx.conf /etc/nginx/conf.d/aliran-tunai.conf
            sudo nginx -t && sudo systemctl enable --now nginx && sudo systemctl reload nginx
          fi

          sleep 5
          sudo systemctl is-active aliran-api-server && echo "API ok"  || (echo "API FAILED"; sudo journalctl -u aliran-api-server -n 50 --no-pager; exit 1)
          sudo systemctl is-active aliran-whatsapp   && echo "WA ok"   || (echo "WA FAILED";  sudo journalctl -u aliran-whatsapp   -n 50 --no-pager; exit 1)
        REMOTE

    - name: Post-deployment verification
      if: always()
      run: |
        sleep 10
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          ec2-user@${{ secrets.EC2_HOST }} '
            echo "=== Service Status ==="
            sudo systemctl is-active aliran-api-server || true
            sudo systemctl is-active aliran-whatsapp   || true
            echo "=== Health ==="
            curl -sf http://localhost:5001/health && echo " API healthy"  || echo " API DOWN"
            curl -sf http://localhost:5002/health && echo " WA  healthy"  || echo " WA  DOWN"
          '

    - name: Cleanup SSH
      if: always()
      run: rm -f ~/.ssh/deploy_key

  # ============= ROLLBACK JOB =============
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'
    needs: [deploy]

    steps:
    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

    - name: Rollback on EC2
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          ec2-user@${{ secrets.EC2_HOST }} 'bash -s' <<'REMOTE'
          set -e
          cd /opt/aliran-tunai
          if [ ! -d backup ]; then
            echo "No backup directory; cannot rollback"; exit 1
          fi
          sudo systemctl stop aliran-api-server || true
          sudo systemctl stop aliran-whatsapp   || true
          rm -rf current
          mv backup current
          cd current
          if [ ! -d venv ]; then
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
          fi
          sudo systemctl start aliran-api-server
          sudo systemctl start aliran-whatsapp
          echo "Rollback complete"
        REMOTE

    - name: Cleanup SSH
      if: always()
      run: rm -f ~/.ssh/deploy_key
