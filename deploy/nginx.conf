# Rate limiting zone (must live in http{}). Some distros only include
# /etc/nginx/conf.d/*.conf, so we declare it here at file scope. If your
# main nginx.conf already has a zone named 'api', delete this line.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# HTTP server. Certbot will inject the TLS server block (and a redirect)
# after `sudo certbot --nginx -d api.aliran-tunai.com` is run on the box.
server {
    listen 80;
    server_name api.aliran-tunai.com;

    # Logging
    access_log /var/log/nginx/aliran-tunai.access.log;
    error_log  /var/log/nginx/aliran-tunai.error.log;

    # Security headers (kept on HTTP too; certbot leaves them in place)
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff"    always;
    add_header Referrer-Policy          "no-referrer-when-downgrade" always;

    # Generous body size for receipt image uploads
    client_max_body_size 10m;

    # Per-client rate limit
    limit_req zone=api burst=20 nodelay;

    # Health check (API server, port 5001)
    location = /health {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;
    }

    # WhatsApp webhook -> WhatsApp service (port 5002)
    location /whatsapp/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering off;

        limit_except GET POST {
            deny all;
        }
    }

    # REST API -> API server (port 5001)
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffer_size 4k;
        proxy_buffers     8 4k;
    }

    # Optional static assets
    location /static/ {
        alias /opt/aliran-tunai/current/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Block access to dotfiles and source
    location ~ /\.(env|git|htaccess|htpasswd|ini|log|sh|sql|conf)$ {
        deny all;
        return 404;
    }
    location ~ \.py$ {
        deny all;
        return 404;
    }

    # Default: 404 for unknown routes
    location / {
        return 404;
    }
}
